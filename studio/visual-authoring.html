<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Visual Authoring · Teach Curio Studio</title><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="visual-authoring.css"><script src="auth.js"></script><script>window.__studioSession=window.RupaiAuth.requireStudioAccess();</script></head><body>
<header class="author-top"><a class="secondary" id="backRenderer">← Renderer</a><div><span class="eyebrow">PRODUCTION WORKSPACE</span><h1 id="title">Visual Authoring</h1></div><label>Layout<select id="layout"><option value="compact">Compact</option><option value="presentation">Presentation</option><option value="mobile">Mobile</option><option value="print">Print</option><option value="worksheet">Worksheet</option></select></label><button class="secondary" id="applyLayout">Apply layout</button><button class="primary" id="validate">Quality check</button></header>
<main class="author-grid"><aside class="panel objects"><h2>Objects & layers</h2><p class="muted">Click, Shift-click, or drag a selection box.</p><div class="toolbar"><button data-action="all">All</button><button data-action="duplicate">Duplicate</button><button data-action="delete">Delete</button><button data-action="lock">Lock</button><button data-action="unlock">Unlock</button><button data-action="hide">Hide</button><button data-action="show">Show</button><button data-action="front">Front</button><button data-action="back">Back</button></div><div class="toolbar"><button data-action="group">Group</button><button data-action="ungroup">Ungroup</button><button data-action="copy">Copy</button><button data-action="paste">Paste</button></div><div id="objectList" class="object-list"></div><h3>Groups</h3><div id="groupList"></div></aside>
<section class="workspace"><div class="smartbar"><label><input type="checkbox" id="snapGrid" checked> Snap grid</label><label><input type="checkbox" id="snapObject" checked> Snap objects</label><span>Smart guides · equal spacing</span><button data-arrange="align_left">Left</button><button data-arrange="align_center">Center</button><button data-arrange="align_right">Right</button><button data-arrange="align_top">Top</button><button data-arrange="align_middle">Middle</button><button data-arrange="distribute_horizontal">Space H</button><button data-arrange="distribute_vertical">Space V</button></div><div class="canvasViewport"><div id="canvas" tabindex="0" aria-label="Visual object authoring canvas"><div id="marquee"></div></div></div><form id="transform" class="transform"><label>X<input name="x" type="number"></label><label>Y<input name="y" type="number"></label><label>Width<input name="width" type="number" min="44"></label><label>Height<input name="height" type="number" min="32"></label><label>Rotate<input name="rotation" type="number"></label><label>Name<input name="title"></label><button class="primary">Apply to selection</button></form><div id="status" role="status"></div></section>
<aside class="panel production"><details open><summary>Worksheet builder</summary><form id="worksheetForm"><label>Title<input name="title" required></label><button class="primary">Create worksheet</button></form><form id="questionForm" hidden><label>Question type<select name="type" id="questionType"></select></label><label>Prompt<input name="prompt" required></label><label>Answer<input name="answer" required></label><label>Hint<input name="hint"></label><label>Marks<input name="marks" type="number" min="0" value="1"></label><button class="primary">Add activity</button></form><div id="worksheetList"></div></details>
<details><summary>Multi-page & print</summary><form id="printForm"><label>Preset<select name="preset" id="printPreset"></select></label><label>Manual page breaks<input name="breaks" placeholder="800, 1600"></label><label><input type="checkbox" name="repeatHeaders" checked> Repeat headers</label><label><input type="checkbox" name="repeatLegends" checked> Repeat legends</label><button class="primary">Prepare print plan</button></form><div id="printStatus"></div></details>
<details><summary>Packages & export</summary><label>Package<select id="packageType"></select></label><button class="primary" id="createPackage">Create package</button><label>Export<select id="exportFormat"><option value="json_backup">JSON backup</option><option value="printable_html">Printable HTML</option><option value="svg">SVG</option><option value="png">PNG</option><option value="pdf_ready">PDF ready</option></select></label><button class="secondary" id="prepareExport">Prepare export</button><div id="exportStatus"></div></details>
<details><summary>Publishing checklist</summary><form id="checklist"></form><button class="primary" id="publish">Publish visual</button></details><details><summary>Change history</summary><div id="history"></div></details><details open><summary>Quality & accessibility</summary><div id="quality"></div><pre id="textSummary"></pre></details></aside></main>
<script src="store.js"></script><script src="educational-visual-service.js"></script><script src="professional-render-service.js"></script><script src="visual-authoring-service.js"></script><script src="visual-authoring.js"></script></body></html>
