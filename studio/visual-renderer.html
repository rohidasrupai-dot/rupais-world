<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professional Visual Renderer · Teach Curio Studio</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="visual-renderer.css"><script src="auth.js"></script><script>window.__studioSession=window.RupaiAuth.requireStudioAccess();</script></head><body><div class="renderer-shell"><header class="renderer-top"><a class="secondary" id="backVisuals">← Educational Visuals</a><h1 id="visualTitle">Professional Renderer</h1><label>Mode<select id="renderMode"></select></label><label>Theme<select id="theme"></select></label><label>Language<select id="languageMode"><option value="english">English</option><option value="hinglish">Hinglish</option><option value="dual">English + Hinglish</option></select></label><button class="primary" id="studentView">Student View</button><button class="secondary" id="printView">Print</button></header><div class="renderer-layout"><aside class="tool-panel creator-only"><h2>Canvas</h2><div class="canvas-controls"><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="resetView">Reset</button><button id="fitView">Fit</button><button id="centerView">Center</button></div><label><input type="checkbox" id="showGrid"> Grid</label><label><input type="checkbox" id="snapGrid"> Snap to grid</label><label><input type="checkbox" id="safeMargins"> Safe margins</label><label>Layout<select id="layoutMode"><option value="auto">Auto</option><option value="top_down">Top-down</option><option value="left_to_right">Left-to-right</option><option value="radial">Radial</option><option value="circular">Circular</option><option value="network">Network</option><option value="horizontal">Horizontal timeline</option><option value="vertical">Vertical timeline</option><option value="alternating">Alternating timeline</option><option value="multi_track">Multi-track</option></select></label><button class="secondary" id="autoLayout">Apply Rule-Based Layout</button><button class="secondary" id="undoLayout">Undo Layout</button><details open><summary>Text overlay</summary><form id="overlayForm"><label>Type<select name="overlayType"><option>title</option><option>subtitle</option><option>label</option><option>caption</option><option>callout</option><option>date</option><option>location</option><option>legend</option><option>source_note</option><option>uncertainty_note</option></select></label><label>English<input name="english" required></label><label>Hinglish<input name="hinglish"></label><label>X<input name="x" type="number" value="40"></label><label>Y<input name="y" type="number" value="40"></label><label>Accessibility label<input name="accessibilityLabel"></label><button class="primary">Add Overlay</button></form><button class="secondary" id="arrangeLabels">Auto-arrange Labels</button></details><details><summary>Map layer</summary><form id="layerForm"><label>Layer<select name="type" id="layerType"></select></label><label>Name<input name="name" required></label><label>Legend entry<input name="legendEntry"></label><button class="primary">Add Layer</button></form><div id="layerList" class="layer-list"></div></details><details><summary>Map marker</summary><form id="markerForm"><label>Name<input name="name" required></label><label>Type<select name="markerType" id="markerType"></select></label><label>Schematic X %<input name="x" type="number" value="50"></label><label>Schematic Y %<input name="y" type="number" value="50"></label><label>Latitude<input name="latitude" type="number" step="any"></label><label>Longitude<input name="longitude" type="number" step="any"></label><label>Description<textarea name="description"></textarea></label><label>Source<input name="source" required></label><label>Accuracy<select name="accuracyStatus" id="markerAccuracy"></select></label><button class="primary">Add Marker</button></form></details><details><summary>Route or path</summary><form id="pathForm"><label>Label<input name="label"></label><label>Points (x,y; x,y)<input name="points" placeholder="10,20; 60,70"></label><label>Description<input name="description"></label><label>Source<input name="source" required></label><button class="primary">Add Schematic Route</button></form></details><details><summary>Student activity</summary><form id="activityForm"><label>Interaction<select name="interactionType"><option>tap_location</option><option>arrange_timeline</option><option>match_labels</option><option>reveal_labels</option><option>trace_route</option><option>complete_flowchart</option></select></label><label>Prompt<input name="prompt" required></label><label>Correct response<input name="correctResponse" required></label><label>Marks<input name="marks" type="number" value="1"></label><label>Hint<input name="hint"></label><button class="primary">Save Activity</button></form></details><details><summary>Print & export</summary><label>Print preset<select id="printPreset"><option value="a4_portrait">A4 portrait</option><option value="a4_landscape">A4 landscape</option><option value="revision_sheet">Revision sheet</option><option value="worksheet">Worksheet</option><option value="map_practice">Map practice sheet</option><option value="timeline_summary">Timeline summary</option><option value="diagram_worksheet">Diagram worksheet</option><option value="answer_key">Answer-key version</option><option value="student_no_answers">Student version without answers</option></select></label><button class="secondary" id="exportSvg">Download SVG</button><button class="secondary" id="exportJson">Download JSON</button><button class="secondary" id="exportHtml">Printable HTML</button><button class="secondary" id="preparePng">Prepare PNG</button><button class="secondary" id="preparePdf">PDF Status</button><p id="exportStatus" class="export-status"></p></details></aside><main class="canvas-zone"><section id="visualCanvas" class="visual-canvas" tabindex="0" aria-label="Interactive educational visual canvas"><svg id="renderSvg" class="render-svg" role="img"></svg><div id="overlayLayer"></div></section></main><aside class="tool-panel right-panel"><h2>Validation & interaction</h2><div id="warnings" class="warning-list"></div><div id="infoCard"></div><h3>Accessible marker list</h3><div id="markerList" class="marker-list"></div><h3>Timeline events</h3><div id="eventList" class="event-list"></div><div id="activityBox"></div><details class="mobile-list"><summary>Structured text representation</summary><pre id="textSummary" class="print-summary"></pre></details></aside></div></div><script src="store.js"></script><script src="educational-visual-service.js"></script><script src="professional-render-service.js"></script><script src="visual-renderer.js"></script></body></html>
