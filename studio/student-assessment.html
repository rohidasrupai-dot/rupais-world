<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Assessment · Teach Curio</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assessment.css"><script src="auth.js"></script><script>window.__studentSession=RupaiAuth.requirePermission('quiz.take');</script></head><body><main class="assessment-shell"><header class="assessment-top"><a id="backQuiz" href="quiz.html">← Quiz Builder</a><h1>Teach Curio Assessment</h1><span class="save" id="saveState" role="status" aria-live="polite">Ready</span></header>
<section id="startScreen" class="card start-card"><span class="eyebrow">Student assessment</span><h2 id="quizTitle">Quiz</h2><p id="lessonName"></p><div class="meta-grid" id="startMeta"></div><div class="notice" id="instructions">Answer carefully. Your work is saved after every change.</div><div class="actions"><button class="primary" id="startQuiz">Start Quiz</button><button class="secondary hidden" id="resumeQuiz">Resume Attempt</button></div></section>
<section id="player" class="hidden"><div class="player-head"><strong id="questionCounter"></strong><div class="progress" style="flex:1"><span id="progressBar"></span></div><strong class="timer" id="timer" aria-live="polite"></strong></div><div class="player-grid"><article class="card question-card"><div id="questionContent"></div><div id="practiceFeedback"></div><div class="actions"><button class="secondary" id="previous">Previous</button><button class="secondary" id="clearAnswer">Clear Answer</button><button class="secondary" id="markReview">Mark for Review</button><button class="primary" id="saveNext">Save & Next</button><button class="danger" id="submitQuiz">Submit Quiz</button></div></article><aside class="card palette-panel"><h2>Questions</h2><div class="palette" id="palette"></div><div class="legend"><span>✓ Answered</span><span>☆ Marked for review</span><span>Outline: current question</span></div><button class="secondary" id="pauseQuiz">Pause</button></aside></div></section>
<section id="results" class="hidden"><article class="card result-hero"><span class="eyebrow">Assessment result</span><h2 id="resultTitle">Quiz completed</h2><div class="score-ring" id="scoreRing"><strong id="scorePercent">0%</strong></div><p id="resultState"></p><div class="metric-grid" id="resultMetrics"></div><div class="actions" style="justify-content:center"><button class="primary" data-retake="all">Retake Entire Quiz</button><button class="secondary" data-retake="incorrect">Retry Incorrect</button><button class="secondary" data-retake="unanswered">Retry Unanswered</button><button class="secondary" data-retake="adaptive">Practice Weak Topics</button></div></article><section class="card" style="margin-top:18px"><h2>Personal revision plan</h2><div class="recommendations" id="recommendations"></div></section><section class="card" style="margin-top:18px"><h2>Question review</h2><div class="review-list" id="reviewList"></div></section></section></main>
<script src="store.js"></script><script src="quiz-service.js"></script><script src="assessment-service.js"></script><script src="student-assessment.js"></script></body></html>
