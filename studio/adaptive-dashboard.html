<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning Progress · Curio</title><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="adaptive-dashboard.css"><script src="auth.js"></script><script>window.__studioSession=RupaiAuth.requireStudioAccess();</script></head><body><header class="adaptive-head"><a class="secondary" href="index.html">← Studio</a><div><span>PERSONALIZED LEARNING</span><h1>My Learning Progress</h1></div><label>Student<input id="studentId" value="student_placeholder"></label><button id="load" class="primary">Load Profile</button></header><main><section id="metrics" class="metrics"></section><div class="adaptive-grid"><section class="card"><h2>Student Learning Profile</h2><form id="profile"><label>Learning style<select name="learningStyle"><option value="visual">Visual learner</option><option value="reading">Reading learner</option><option value="practice">Practice learner</option><option value="mixed">Mixed</option></select></label><label>Language<select name="preferredLanguage"><option value="english">English</option><option value="hindi">Hindi</option><option value="hinglish">Hinglish</option><option value="dual">English + Hinglish</option></select></label><label>Reading level<select name="readingLevel"><option value="simple_english">Simple English</option><option value="normal_english">Normal English</option><option value="detailed_english">Detailed English</option><option value="simple_hinglish">Simple Hinglish</option><option value="english_hinglish">English + Hinglish</option></select></label><label>Teaching speed<select name="teachingSpeed"><option>slow</option><option selected>normal</option><option>fast</option></select></label><label>Detail level<select name="detailLevel"><option>minimal</option><option selected>normal</option><option>detailed</option></select></label><label>Study goal<input name="studyGoal"></label><fieldset><legend>Accessibility</legend><label><input type="checkbox" name="largeText"> Large text</label><label><input type="checkbox" name="highContrast"> High contrast</label><label><input type="checkbox" name="reducedMotion"> Reduced motion</label><label><input type="checkbox" name="simplifiedUi"> Simplified UI</label><label><input type="checkbox" name="captionFirst"> Caption-first</label></fieldset><button class="primary">Save Profile</button></form><p id="saveStatus" role="status"></p></section><section><div class="card"><h2>Mastery</h2><div id="mastery"></div></div><div class="card"><h2>Weak topics</h2><div id="weak"></div></div></section><section><div class="card"><h2>Revision due</h2><div id="revision"></div></div><div class="card"><h2>Why Curio adapted</h2><div id="decisions"></div></div></section></div></main><script src="store.js"></script><script src="curio-runtime-service.js"></script><script src="adaptive-learning-service.js"></script><script src="adaptive-dashboard.js"></script></body></html>
