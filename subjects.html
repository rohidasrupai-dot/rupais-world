<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/pwa-icon-192.png">
  <title>Subjects | Rupai's World</title>
  <link rel="stylesheet" href="subjects.css?v=illustrated-search-popup-1">
  <link rel="stylesheet" href="pwa-client.css?v=phase14a">
</head>
<body>
  <main class="reference-page" aria-label="Search Subjects">
    <img class="reference-image" src="assets/search-subjects-flower-removed-v1.png" alt="Search Subjects with History, Geography, Polity, Economy, Science, Environment, Reasoning, Maths, English and Current Affairs">

    <a class="hotspot close-page" href="index.html" aria-label="Close Search Subjects and return home"></a>
    <button class="hotspot search" type="button" id="openSearch" aria-label="Search subjects and topics"></button>

    <button class="hotspot subject history" type="button" data-subject="History" aria-label="Open History"></button>
    <button class="hotspot subject geography" type="button" data-subject="Geography" aria-label="Open Geography"></button>
    <button class="hotspot subject polity" type="button" data-subject="Polity" aria-label="Open Polity"></button>
    <button class="hotspot subject economy" type="button" data-subject="Economy" aria-label="Open Economy"></button>
    <button class="hotspot subject science" type="button" data-subject="Science" aria-label="Open Science"></button>
    <button class="hotspot subject environment" type="button" data-subject="Environment" aria-label="Open Environment"></button>
    <button class="hotspot subject reasoning" type="button" data-subject="Reasoning" aria-label="Open Reasoning"></button>
    <button class="hotspot subject maths" type="button" data-subject="Maths" aria-label="Open Maths"></button>
    <button class="hotspot subject english" type="button" data-subject="English" aria-label="Open English"></button>
    <button class="hotspot subject current-affairs" type="button" data-subject="Current Affairs" aria-label="Open Current Affairs"></button>
  </main>

  <dialog id="subjectDialog">
    <button class="dialog-x" type="button" aria-label="Close">×</button>
    <div class="dialog-icon">✨</div>
    <h2></h2><p></p>
    <button class="dialog-ok" type="button">Okay!</button>
  </dialog>

  <dialog id="searchDialog">
    <img class="search-popup-art" src="assets/search-subjects-popup-reference-v1.png" alt="Search Subjects">
    <button class="dialog-x popup-close" type="button" aria-label="Close"></button>
    <form id="subjectSearch">
      <input id="subjectQuery" type="search" placeholder="Search subjects, topics..." aria-label="Search subjects and topics" autocomplete="off">
      <button type="submit" aria-label="Search"></button>
    </form>
    <div class="popup-subject-hotspots" aria-label="Subjects">
      <button class="popup-subject history" type="button" data-search-subject="History" aria-label="Open History"></button>
      <button class="popup-subject geography" type="button" data-search-subject="Geography" aria-label="Open Geography"></button>
      <button class="popup-subject polity" type="button" data-search-subject="Polity" aria-label="Open Polity"></button>
      <button class="popup-subject economy" type="button" data-search-subject="Economy" aria-label="Open Economy"></button>
      <button class="popup-subject science" type="button" data-search-subject="Science" aria-label="Open Science"></button>
      <button class="popup-subject environment" type="button" data-search-subject="Environment" aria-label="Open Environment"></button>
      <button class="popup-subject reasoning" type="button" data-search-subject="Reasoning" aria-label="Open Reasoning"></button>
      <button class="popup-subject maths" type="button" data-search-subject="Maths" aria-label="Open Maths"></button>
      <button class="popup-subject english" type="button" data-search-subject="English" aria-label="Open English"></button>
      <button class="popup-subject current-affairs" type="button" data-search-subject="Current Affairs" aria-label="Open Current Affairs"></button>
    </div>
  </dialog>
  <script src="favorites-store.js"></script>
  <script src="subjects.js?v=illustrated-search-popup-1"></script>
  <script src="pwa-client.js?v=phase14a"></script>
</body>
</html>
